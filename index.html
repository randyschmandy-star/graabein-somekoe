<!doctype html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graabein Skjegg – Innleggskø</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1f1b16;
    --muted: #6b6259;
    --line: #e7e2da;
    --accent: #3f3a2e;
    --accent-ink: #ffffff;
    --good: #3a7a4e;
    --bad: #a3402f;
    --warn: #b8862f;
    --fb: #1877f2;
    --ig: #c13584;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .tab.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1200px;
  }
  .gruppe {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1 1 300px;
    max-width: 380px;
  }
  .card img, .card video {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #000;
  }
  .card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input[type="text"], input[type="url"], select {
    width: 100%;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.85rem;
    font-family: inherit;
    background: white;
  }
  .row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }
  input[type="datetime-local"] {
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.85rem;
    flex: 1;
    min-width: 160px;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    flex: 1;
  }
  .btn-approve { background: var(--good); color: white; }
  .btn-reject { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn-retry { background: var(--warn); color: white; }
  .btn-delete { background: transparent; color: var(--muted); border: 1px solid var(--line); flex: 0 0 auto; }
  .btn-delete:hover { color: var(--bad); border-color: var(--bad); }
  .btn-add { background: var(--accent); color: var(--accent-ink); }
  .status-line {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .status-line.error { color: var(--bad); }
  .hint {
    font-size: 0.75rem;
    color: var(--muted);
    font-style: italic;
  }
  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 40px 0;
    text-align: center;
  }
  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eee;
    color: var(--muted);
  }
  .badge.plattform-facebook { background: var(--fb); color: white; }
  .badge.plattform-instagram { background: var(--ig); color: white; }
  .badge.type { background: #ddd6c8; color: var(--ink); }

  .legg-til-kort {
    flex: 1 1 260px;
    max-width: 320px;
    border: 2px dashed var(--line);
    border-radius: 12px;
    display: flex;
    align-items: stretch;
    justify-content: center;
    min-height: 120px;
    padding: 16px;
  }
  .legg-til-kort button.apne {
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .legg-til-skjema {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .legg-til-skjema label {
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<h1>Graabein Skjegg – Innleggskø</h1>
<p class="sub">Se over utkast, rediger tekst, velg tidspunkt, og godkjenn. Ulike varianter (plattform × innlegg/story/reel) av samme bilde eller video vises side ved side.</p>

<div class="tabs">
  <div class="tab active" data-tab="utkast">Til godkjenning</div>
  <div class="tab" data-tab="godkjent">I kø</div>
  <div class="tab" data-tab="postet">Postet</div>
  <div class="tab" data-tab="feilet">Feilet</div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden>Ingenting her akkurat nå.</div>

<!-- ====== TODO: fyll inn din Firebase-konfigurasjon (Prosjektinnstillinger → Dine apper) ====== -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDN1sjsPlIF-cq2JVtu6NLmc_gVeTrOLPw",
    authDomain: "graabeinsome.firebaseapp.com",
    projectId: "graabeinsome",
    storageBucket: "graabeinsome.firebasestorage.app",
    messagingSenderId: "533801152878",
    appId: "1:533801152878:web:b44288b4e0eb18542c517f",
  };
</script>
<!-- ============================================================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentTab = "utkast";
  let unsubscribe = null;

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      currentTab = tab.dataset.tab;
      lyttPaKollen();
    });
  });

  function formatDatetimeLocal(timestamp) {
    if (!timestamp) return "";
    const d = timestamp.toDate();
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function plattformNavn(p) {
    if (p === "facebook") return "Facebook";
    if (p === "instagram") return "Instagram";
    return p || "Ukjent plattform";
  }

  function typeNavn(t) {
    if (t === "story") return "Story";
    if (t === "reel") return "Reel";
    return "Innlegg";
  }

  async function slettInnlegg(id) {
    if (confirm("Slette dette innlegget permanent? Dette kan ikke angres.")) {
      await db.collection("innlegg").doc(id).delete();
    }
  }

  function renderKort(id, data) {
    const mediaUrl = data.mediaUrl || data.bildeUrl;
    const mediaType = data.mediaType || "image";
    const type = data.type || "feed";

    const div = document.createElement("div");
    div.className = "card";

    const media = mediaType === "video" ? document.createElement("video") : document.createElement("img");
    media.src = mediaUrl;
    if (mediaType === "video") {
      media.controls = true;
      media.muted = true;
    } else {
      media.alt = "Innleggsbilde";
    }
    div.appendChild(media);

    const body = document.createElement("div");
    body.className = "card-body";

    const badges = document.createElement("div");
    badges.className = "badges";
    const statusBadge = document.createElement("span");
    statusBadge.className = "badge";
    statusBadge.textContent = data.status;
    badges.appendChild(statusBadge);
    const plattformBadge = document.createElement("span");
    plattformBadge.className = `badge plattform-${data.plattform || "ukjent"}`;
    plattformBadge.textContent = plattformNavn(data.plattform);
    badges.appendChild(plattformBadge);
    const typeBadge = document.createElement("span");
    typeBadge.className = "badge type";
    typeBadge.textContent = typeNavn(type);
    badges.appendChild(typeBadge);
    body.appendChild(badges);

    const textarea = document.createElement("textarea");
    textarea.value = data.tekst || "";
    textarea.disabled = data.status !== "utkast";
    body.appendChild(textarea);

    if (type === "story") {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "Vises ikke på selve Story-en (Meta støtter ikke bildetekst der) – kun til eget notat.";
      body.appendChild(hint);
    }

    if (data.status === "utkast") {
      const timeInput = document.createElement("input");
      timeInput.type = "datetime-local";
      timeInput.value = formatDatetimeLocal(data.planlagtTid);
      timeInput.title = "La stå tomt for å poste så snart som mulig";
      body.appendChild(timeInput);

      const actions = document.createElement("div");
      actions.className = "actions";

      const godkjennBtn = document.createElement("button");
      godkjennBtn.className = "btn-approve";
      godkjennBtn.textContent = "Godkjenn";
      godkjennBtn.onclick = async () => {
        if (type === "reel" && mediaType !== "video") {
          alert("Reel krever video. Dette kortet har bare bilde, så det kan ikke godkjennes som Reel.");
          return;
        }
        const oppdatering = {
          status: "godkjent",
          tekst: textarea.value,
          planlagtTid: timeInput.value
            ? firebase.firestore.Timestamp.fromDate(new Date(timeInput.value))
            : null,
        };
        await db.collection("innlegg").doc(id).update(oppdatering);
      };
      actions.appendChild(godkjennBtn);

      const avvisBtn = document.createElement("button");
      avvisBtn.className = "btn-reject";
      avvisBtn.textContent = "Avvis";
      avvisBtn.onclick = async () => {
        if (confirm("Avvise dette utkastet?")) {
          await db.collection("innlegg").doc(id).update({ status: "avvist" });
        }
      };
      actions.appendChild(avvisBtn);

      body.appendChild(actions);
    }

    if (data.status === "godkjent") {
      const info = document.createElement("div");
      info.className = "status-line";
      info.textContent = data.planlagtTid
        ? `Postes ${data.planlagtTid.toDate().toLocaleString("no-NO")}`
        : "Postes så snart som mulig (innen ~10 min)";
      body.appendChild(info);
    }

    if (data.status === "postet") {
      const info = document.createElement("div");
      info.className = "status-line";
      const tid = data.postetTid ? data.postetTid.toDate().toLocaleString("no-NO") : "";
      info.textContent = `Postet ${tid}`;
      body.appendChild(info);
    }

    if (data.status === "feilet") {
      const info = document.createElement("div");
      info.className = "status-line error";
      info.textContent = data.feilmelding || "Ukjent feil";
      body.appendChild(info);

      const retryBtn = document.createElement("button");
      retryBtn.className = "btn-retry";
      retryBtn.textContent = "Prøv igjen";
      retryBtn.onclick = async () => {
        await db.collection("innlegg").doc(id).update({ status: "godkjent", feilmelding: null });
      };
      body.appendChild(retryBtn);
    }

    // Slett-knapp: tilgjengelig uansett status.
    const slettRad = document.createElement("div");
    slettRad.className = "actions";
    const slettBtn = document.createElement("button");
    slettBtn.className = "btn-delete";
    slettBtn.textContent = "Slett";
    slettBtn.onclick = () => slettInnlegg(id);
    slettRad.appendChild(slettBtn);
    body.appendChild(slettRad);

    div.appendChild(body);
    return div;
  }

  /**
   * "+ Legg til variant"-kort: lar deg opprette en ny plattform/type-
   * kombinasjon (f.eks. legge en Reel til et bilde-sett, eller legge
   * Instagram-varianten til noe som til nå bare har Facebook).
   * Ny variant blir alltid et nytt utkast med samme gruppeId.
   */
  function renderLeggTilKort(gruppeId, forslag) {
    const div = document.createElement("div");
    div.className = "legg-til-kort";

    const apneBtn = document.createElement("button");
    apneBtn.className = "apne";
    apneBtn.textContent = "+ Legg til variant";

    const skjema = document.createElement("div");
    skjema.className = "legg-til-skjema";
    skjema.style.display = "none";

    const plattformSelect = document.createElement("select");
    ["facebook", "instagram"].forEach((p) => {
      const opt = document.createElement("option");
      opt.value = p;
      opt.textContent = plattformNavn(p);
      plattformSelect.appendChild(opt);
    });

    const typeSelect = document.createElement("select");
    ["feed", "story", "reel"].forEach((t) => {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = typeNavn(t);
      typeSelect.appendChild(opt);
    });

    const mediaTypeSelect = document.createElement("select");
    [["image", "Bilde"], ["video", "Video"]].forEach(([v, navn]) => {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = navn;
      mediaTypeSelect.appendChild(opt);
    });
    mediaTypeSelect.value = forslag.mediaType || "image";

    typeSelect.addEventListener("change", () => {
      if (typeSelect.value === "reel") mediaTypeSelect.value = "video";
    });

    const mediaUrlInput = document.createElement("input");
    mediaUrlInput.type = "url";
    mediaUrlInput.value = forslag.mediaUrl || "";
    mediaUrlInput.placeholder = "URL til bilde/video (Firebase Storage)";

    const tekstInput = document.createElement("textarea");
    tekstInput.value = forslag.tekst || "";
    tekstInput.placeholder = "Bildetekst for denne varianten";

    const lagBtn = document.createElement("button");
    lagBtn.className = "btn-add";
    lagBtn.textContent = "Opprett utkast";
    lagBtn.onclick = async () => {
      if (typeSelect.value === "reel" && mediaTypeSelect.value !== "video") {
        alert("Reel krever video – velg Video som medietype, eller lim inn en videourl.");
        return;
      }
      if (!mediaUrlInput.value) {
        alert("Fyll inn en URL til bilde eller video.");
        return;
      }
      await db.collection("innlegg").add({
        mediaUrl: mediaUrlInput.value,
        mediaType: mediaTypeSelect.value,
        tekst: tekstInput.value,
        status: "utkast",
        plattform: plattformSelect.value,
        type: typeSelect.value,
        gruppeId,
        opprettet: firebase.firestore.FieldValue.serverTimestamp(),
      });
      skjema.style.display = "none";
      apneBtn.style.display = "";
    };

    [
      ["Plattform", plattformSelect],
      ["Type", typeSelect],
      ["Medietype", mediaTypeSelect],
      ["Bilde/video-URL", mediaUrlInput],
      ["Tekst", tekstInput],
    ].forEach(([navn, felt]) => {
      const label = document.createElement("label");
      label.textContent = navn;
      skjema.appendChild(label);
      skjema.appendChild(felt);
    });
    skjema.appendChild(lagBtn);

    apneBtn.onclick = () => {
      skjema.style.display = "flex";
      apneBtn.style.display = "none";
    };

    div.appendChild(apneBtn);
    div.appendChild(skjema);
    return div;
  }

  function lyttPaKollen() {
    if (unsubscribe) unsubscribe();
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    unsubscribe = db
      .collection("innlegg")
      .where("status", "==", currentTab)
      .orderBy("opprettet", "desc")
      .onSnapshot((snap) => {
        grid.innerHTML = "";
        if (snap.empty) {
          empty.hidden = false;
          return;
        }
        empty.hidden = true;

        // Grupper varianter av samme bilde/video (delt gruppeId) sammen,
        // slik at de vises side ved side.
        const grupper = new Map();
        const rekkefolge = [];
        snap.forEach((doc) => {
          const data = doc.data();
          const nokkel = data.gruppeId || doc.id;
          if (!grupper.has(nokkel)) {
            grupper.set(nokkel, []);
            rekkefolge.push(nokkel);
          }
          grupper.get(nokkel).push({ id: doc.id, data });
        });

        rekkefolge.forEach((nokkel) => {
          const dokumenter = grupper.get(nokkel);
          const gruppeDiv = document.createElement("div");
          gruppeDiv.className = "gruppe";
          dokumenter.forEach(({ id, data }) => {
            gruppeDiv.appendChild(renderKort(id, data));
          });
          const forste = dokumenter[0].data;
          gruppeDiv.appendChild(
            renderLeggTilKort(nokkel, {
              mediaUrl: forste.mediaUrl || forste.bildeUrl,
              mediaType: forste.mediaType || "image",
              tekst: "",
            })
          );
          grid.appendChild(gruppeDiv);
        });
      });
  }

  lyttPaKollen();
</script>
</body>
</html>

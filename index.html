<!doctype html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Graabein Skjegg – Innleggskø</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --ink: #1f1b16;
    --muted: #6b6259;
    --line: #e7e2da;
    --accent: #3f3a2e;
    --accent-ink: #ffffff;
    --good: #3a7a4e;
    --bad: #a3402f;
    --warn: #b8862f;
    --fb: #1877f2;
    --ig: #c13584;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px 16px 64px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .tab.active {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: var(--accent);
  }
  .grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    max-width: 1100px;
  }
  .gruppe {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1 1 300px;
    max-width: 420px;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #eee;
  }
  .card-body {
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    font-size: 0.85rem;
  }
  input[type="datetime-local"] {
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 0.85rem;
    flex: 1;
    min-width: 160px;
  }
  .actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.85rem;
    cursor: pointer;
    flex: 1;
  }
  .btn-approve { background: var(--good); color: white; }
  .btn-reject { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
  .btn-retry { background: var(--warn); color: white; }
  .btn-delete { background: transparent; color: var(--muted); border: 1px solid var(--line); flex: 0 0 auto; }
  .btn-delete:hover { color: var(--bad); border-color: var(--bad); }
  .status-line {
    font-size: 0.8rem;
    color: var(--muted);
  }
  .status-line.error { color: var(--bad); }
  .empty {
    color: var(--muted);
    font-size: 0.9rem;
    padding: 40px 0;
    text-align: center;
  }
  .badges {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eee;
    color: var(--muted);
  }
  .badge.plattform-facebook { background: var(--fb); color: white; }
  .badge.plattform-instagram { background: var(--ig); color: white; }
</style>
</head>
<body>

<h1>Graabein Skjegg – Innleggskø</h1>
<p class="sub">Se over utkast, rediger tekst, velg tidspunkt, og godkjenn. Facebook- og Instagram-varianten av samme bilde vises side ved side.</p>

<div class="tabs">
  <div class="tab active" data-tab="utkast">Til godkjenning</div>
  <div class="tab" data-tab="godkjent">I kø</div>
  <div class="tab" data-tab="postet">Postet</div>
  <div class="tab" data-tab="feilet">Feilet</div>
</div>

<div id="grid" class="grid"></div>
<div id="empty" class="empty" hidden>Ingenting her akkurat nå.</div>

<!-- ====== TODO: fyll inn din Firebase-konfigurasjon (Prosjektinnstillinger → Dine apper) ====== -->
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDN1sjsPlIF-cq2JVtu6NLmc_gVeTrOLPw",
    authDomain: "graabeinsome.firebaseapp.com",
    projectId: "graabeinsome",
    storageBucket: "graabeinsome.firebasestorage.app",
    messagingSenderId: "533801152878",
    appId: "1:533801152878:web:b44288b4e0eb18542c517f",
  };
</script>
<!-- ============================================================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let currentTab = "utkast";
  let unsubscribe = null;

  document.querySelectorAll(".tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      currentTab = tab.dataset.tab;
      lyttPaKollen();
    });
  });

  function formatDatetimeLocal(timestamp) {
    if (!timestamp) return "";
    const d = timestamp.toDate();
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function plattformNavn(p) {
    if (p === "facebook") return "Facebook";
    if (p === "instagram") return "Instagram";
    return p || "Ukjent plattform";
  }

  async function slettInnlegg(id) {
    if (confirm("Slette dette innlegget permanent? Dette kan ikke angres.")) {
      await db.collection("innlegg").doc(id).delete();
    }
  }

  function renderKort(id, data) {
    const div = document.createElement("div");
    div.className = "card";

    const img = document.createElement("img");
    img.src = data.bildeUrl;
    img.alt = "Innleggsbilde";
    div.appendChild(img);

    const body = document.createElement("div");
    body.className = "card-body";

    const badges = document.createElement("div");
    badges.className = "badges";
    const statusBadge = document.createElement("span");
    statusBadge.className = "badge";
    statusBadge.textContent = data.status;
    badges.appendChild(statusBadge);
    const plattformBadge = document.createElement("span");
    plattformBadge.className = `badge plattform-${data.plattform || "ukjent"}`;
    plattformBadge.textContent = plattformNavn(data.plattform);
    badges.appendChild(plattformBadge);
    body.appendChild(badges);

    const textarea = document.createElement("textarea");
    textarea.value = data.tekst || "";
    textarea.disabled = data.status !== "utkast";
    body.appendChild(textarea);

    if (data.status === "utkast") {
      const timeInput = document.createElement("input");
      timeInput.type = "datetime-local";
      timeInput.value = formatDatetimeLocal(data.planlagtTid);
      timeInput.title = "La stå tomt for å poste så snart som mulig";
      body.appendChild(timeInput);

      const actions = document.createElement("div");
      actions.className = "actions";

      const godkjennBtn = document.createElement("button");
      godkjennBtn.className = "btn-approve";
      godkjennBtn.textContent = "Godkjenn";
      godkjennBtn.onclick = async () => {
        const oppdatering = {
          status: "godkjent",
          tekst: textarea.value,
          planlagtTid: timeInput.value
            ? firebase.firestore.Timestamp.fromDate(new Date(timeInput.value))
            : null,
        };
        await db.collection("innlegg").doc(id).update(oppdatering);
      };
      actions.appendChild(godkjennBtn);

      const avvisBtn = document.createElement("button");
      avvisBtn.className = "btn-reject";
      avvisBtn.textContent = "Avvis";
      avvisBtn.onclick = async () => {
        if (confirm("Avvise dette utkastet?")) {
          await db.collection("innlegg").doc(id).update({ status: "avvist" });
        }
      };
      actions.appendChild(avvisBtn);

      body.appendChild(actions);
    }

    if (data.status === "godkjent") {
      const info = document.createElement("div");
      info.className = "status-line";
      info.textContent = data.planlagtTid
        ? `Postes ${data.planlagtTid.toDate().toLocaleString("no-NO")}`
        : "Postes så snart som mulig (innen ~10 min)";
      body.appendChild(info);
    }

    if (data.status === "postet") {
      const info = document.createElement("div");
      info.className = "status-line";
      const tid = data.postetTid ? data.postetTid.toDate().toLocaleString("no-NO") : "";
      info.textContent = `Postet ${tid}`;
      body.appendChild(info);
    }

    if (data.status === "feilet") {
      const info = document.createElement("div");
      info.className = "status-line error";
      info.textContent = data.feilmelding || "Ukjent feil";
      body.appendChild(info);

      const retryBtn = document.createElement("button");
      retryBtn.className = "btn-retry";
      retryBtn.textContent = "Prøv igjen";
      retryBtn.onclick = async () => {
        await db.collection("innlegg").doc(id).update({ status: "godkjent", feilmelding: null });
      };
      body.appendChild(retryBtn);
    }

    // Slett-knapp: tilgjengelig uansett status.
    const slettRad = document.createElement("div");
    slettRad.className = "actions";
    const slettBtn = document.createElement("button");
    slettBtn.className = "btn-delete";
    slettBtn.textContent = "Slett";
    slettBtn.onclick = () => slettInnlegg(id);
    slettRad.appendChild(slettBtn);
    body.appendChild(slettRad);

    div.appendChild(body);
    return div;
  }

  function lyttPaKollen() {
    if (unsubscribe) unsubscribe();
    const grid = document.getElementById("grid");
    const empty = document.getElementById("empty");
    unsubscribe = db
      .collection("innlegg")
      .where("status", "==", currentTab)
      .orderBy("opprettet", "desc")
      .onSnapshot((snap) => {
        grid.innerHTML = "";
        if (snap.empty) {
          empty.hidden = false;
          return;
        }
        empty.hidden = true;

        // Grupper Facebook- og Instagram-varianten av samme bilde
        // sammen (delt gruppeId), slik at de vises side ved side.
        const grupper = new Map();
        const rekkefolge = [];
        snap.forEach((doc) => {
          const data = doc.data();
          const nokkel = data.gruppeId || doc.id;
          if (!grupper.has(nokkel)) {
            grupper.set(nokkel, []);
            rekkefolge.push(nokkel);
          }
          grupper.get(nokkel).push({ id: doc.id, data });
        });

        rekkefolge.forEach((nokkel) => {
          const gruppeDiv = document.createElement("div");
          gruppeDiv.className = "gruppe";
          grupper.get(nokkel).forEach(({ id, data }) => {
            gruppeDiv.appendChild(renderKort(id, data));
          });
          grid.appendChild(gruppeDiv);
        });
      });
  }

  lyttPaKollen();
</script>
</body>
</html>
